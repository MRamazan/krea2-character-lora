[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "krea2-character-lora"
version = "0.1.0"
description = "A character-only Krea 2 LoRA training pipeline with a compact Google Colab interface"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=0.27",
    "numpy>=1.26",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "safetensors>=0.4",
]

[project.optional-dependencies]
dev = [
    "nbformat>=5.10",
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"notebooks/cells/*.py" = ["E402", "F821"]
"notebooks/*.ipynb" = ["E402", "F821"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
